[tool.poetry]
name = "intervals-streamlit"
version = "0.1.0"
description = "streamlit app for crim intervals"
authors = ["Richard Freedman <rfreedma@haverford.edu>"]
license = "Creative Commons NC-SA"
readme = "README.md"


[tool.poetry.dependencies]
# Keep in step with requirements.txt (which Streamlit Community Cloud uses).
python = ">=3.10"
crim-intervals = ">=2.0.86"
streamlit = "1.43.0"
pyarrow = "17.0.0"   # must support numpy 1.x (crim-intervals needs numpy<2)
pandas = ">=2.2,<3"
plotly = ">=5.19"
requests = ">=2.31"
verovio = ">=5.5"


[build-system]

requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
